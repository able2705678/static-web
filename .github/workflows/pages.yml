name: Deploy h5 to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# 允许 Actions 把内容发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 只发布 h5 目录作为站点根，index.html 即在站点根
          path: 'h5'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
